name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Compile
      run: npm run compile
      
    - name: Run Tests
      run: npm test
      
    - name: Package Extension
      run: npx vsce package -o xcaffold-vscode.vsix
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcaffold-vscode-vsix
        path: xcaffold-vscode.vsix
