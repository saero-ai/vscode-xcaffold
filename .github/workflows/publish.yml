name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile (production)
      run: npm run compile:production

    - name: Run tests
      run: npm test

    - name: Publish to VS Code Marketplace
      run: npx vsce publish --no-dependencies
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

    - name: Package VSIX
      run: npx vsce package --no-dependencies -o xcaffold-vscode.vsix

    - name: Upload VSIX to release
      run: gh release upload "${{ github.event.release.tag_name }}" xcaffold-vscode.vsix
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
