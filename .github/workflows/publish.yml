name: Publish to Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., vscode-xcaffold-v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'

    - name: Install xcaffold CLI
      run: go install github.com/saero-ai/xcaffold/cmd/xcaffold@latest

    - name: Generate schemas from CLI
      run: xcaffold schema dump --json > src/generated-schemas.json || true
      continue-on-error: true

    - name: Install dependencies
      run: npm ci

    - name: Compile (production)
      run: npm run compile:production

    - name: Run tests
      run: npm test

    - name: Publish to VS Code Marketplace
      run: npx vsce publish --no-dependencies
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

    - name: Package VSIX
      run: npx vsce package --no-dependencies -o xcaffold-vscode.vsix

    - name: Upload VSIX to release
      run: gh release upload "${{ inputs.tag || github.event.release.tag_name }}" xcaffold-vscode.vsix
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
